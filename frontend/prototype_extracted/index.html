<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #0b0d10;
    --panel: #111418;
    --panel-2: #161a1f;
    --panel-3: #1b2026;
    --line: #222830;
    --line-2: #2c333c;
    --text: #e6eaf0;
    --text-dim: #9098a4;
    --text-mute: #5c6470;
    --accent: #7cf9a4;         /* packet green */
    --accent-2: #58c0ff;       /* hex blue */
    --accent-3: #ffb454;       /* warn amber */
    --accent-4: #ff6a8a;       /* dest pink */
    --accent-5: #c792ea;       /* purple */
    --radius: 6px;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --density: 1;
  }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .light {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --panel-3: #f1f3f6;
    --line: #e4e7eb;
    --line-2: #d4d9df;
    --text: #0e1116;
    --text-dim: #5a6270;
    --text-mute: #8a919c;
  }
  #root { min-height: 100vh; }
  .mono { font-family: var(--mono); }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  /* scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

  @keyframes blinkCaret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes scanPacket { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes flashRow { 0% { background: color-mix(in oklab, var(--accent) 30%, transparent); } 100% { background: transparent; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
